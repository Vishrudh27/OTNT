# Server interface base template.
# PrivateKey, Address, and ListenPort are all injected per-tunnel at
# runtime by buildConfig() in wireguard.js — do not hardcode any of them
# here. ListenPort in particular must stay out of this template: each
# concurrent OTNT tunnel is assigned its own port from a managed pool
# (see PORT_RANGE_START/PORT_RANGE_END in wireguard.js) so multiple
# interfaces can run at once without competing for the same UDP port.
[Interface]
Address = 10.77.0.1/32
# Optional routing hooks:
# PostUp = sysctl -w net.ipv4.ip_forward=1
# PostDown = sysctl -w net.ipv4.ip_forward=0
